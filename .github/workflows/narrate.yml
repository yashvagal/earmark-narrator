# Cloud narration for Earmark: claims chapters queued in the app and reads them aloud with Kokoro on this runner's
# CPU, then uploads the MP3. It proves who it is to the Worker with GitHub's OIDC token, so no secrets live here.
# This repo is public on purpose (public repos get GitHub-hosted runner minutes free); books, text and audio never
# touch it and logs print no titles or text. The app starts it the moment a book is queued (Worker secret
# GITHUB_DISPATCH_TOKEN); the schedule every 6 hours is only a backup. Each run starts one runner per queued chapter,
# up to 16, with one narrator each; the Worker hands every chapter to exactly one of them. Chapters read in the owner's
# own cloned voice (clone.py) come in parts and take the runners left over; the voice sample never touches this repo.
name: narrate
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
jobs:
  # Sizes the run: one runner per queued chapter, up to 16 (public repos get these minutes free; the account runs
  # 20 jobs at once, so 16 leaves room for other repos' checks). Past 16, each narrator claims the next chapter.
  plan:
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.count.outputs.runners }}
      clone_runners: ${{ steps.count.outputs.clone_runners }}
    steps:
      - id: count
        run: |
          h=$(curl -s -o /dev/null -D - https://listen.studiko.app/runner/queued | tr -d '\r')
          n=$(printf '%s\n' "$h" | sed -n 's/^x-queued: *//Ip' | head -1)
          m=$(printf '%s\n' "$h" | sed -n 's/^x-clone-queued: *//Ip' | head -1); m=${m:-0}
          # An older Worker answers 200 without the count: still start one runner.
          if [ -z "$n" ]; then printf '%s\n' "$h" | head -1 | grep -q ' 200' && n=1 || n=0; fi
          r=$n; [ "$r" -gt 16 ] && r=16
          # Own-voice parts get the runners the regular voice leaves free; the Worker starts another run once it is done.
          c=$m; [ "$c" -gt $(( 16 - r )) ] && c=$(( 16 - r ))
          echo "queued $n, runners $r; own-voice parts $m, runners $c"
          echo "runners=$(seq -s, 1 $r | sed 's/^/[/;s/$/]/;s/^\[\]$/[]/')" >> "$GITHUB_OUTPUT"
          echo "clone_runners=$(seq -s, 1 $c | sed 's/^/[/;s/$/]/;s/^\[\]$/[]/')" >> "$GITHUB_OUTPUT"
  narrate:
    needs: plan
    if: needs.plan.outputs.runners != '[]' && needs.plan.outputs.runners != ''
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    steps:
      - name: Start the clock
        run: echo "EARMARK_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installed packages cache
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ hashFiles('package-lock.json') }}
      - name: Voice model cache
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: kokoro-82m-v1-fp32
      - name: Install
        if: steps.deps.outputs.cache-hit != 'true'
        # The CPU build of onnxruntime ships inside the package; its install script only fetches GPU extras.
        run: npm install --no-audit --no-fund --ignore-scripts
      # Loads (and on a cold cache downloads) the voice once, so the narrators below don't race to fetch it.
      - name: Warm the voice
        run: |
          node --input-type=module -e "const { KokoroTTS } = await import('kokoro-js'); await KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX', { dtype: 'fp32', device: 'cpu' }); console.log('voice ready')"
      - name: Narrate
        env:
          STOP_AFTER_MIN: "300"
        # One narrator per runner. On a real 16-chapter book (Nov 25), two long chapters sharing a runner each read at
        # about 1-1.7x real time, while a long chapter with the runner to itself read at about 3x.
        run: npx tsx narrate.ts
      # Feeds the monthly tracker in Settings: GitHub bills each job rounded up to a whole minute, empty runs included.
      # Sends only a number of seconds; 15 s covers runner start-up before the first step.
      - name: Report minutes used
        if: always()
        run: |
          secs=$(( $(date +%s) - ${EARMARK_T0:-$(date +%s)} + 15 ))
          tok=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=earmark-runner" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
          curl -s -o /dev/null -w "usage report: %{http_code}\n" -X POST -H "Authorization: Bearer $tok" -H "content-type: application/json" \
            --data "{\"seconds\":$secs}" https://listen.studiko.app/runner/usage || true
  # The owner's own cloned voice (Qwen3-TTS on CPU, about a fifth of real time): one part of a chapter at a time.
  clone:
    needs: plan
    if: needs.plan.outputs.clone_runners != '[]' && needs.plan.outputs.clone_runners != ''
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.clone_runners) }}
    steps:
      - name: Start the clock
        run: echo "EARMARK_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installed packages cache
        id: venv
        uses: actions/cache@v4
        with:
          path: ~/clone-venv
          key: clone-venv-py312-${{ hashFiles('requirements-clone.txt') }}
      # Models only (Qwen3-TTS and the AudioSeal watermark); the voice sample is never written to disk.
      - name: Voice model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/audioseal
          key: qwen3-tts-0.6b-base-audioseal-v1
      - name: Install
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/clone-venv
          ~/clone-venv/bin/pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
          ~/clone-venv/bin/pip install --quiet -r requirements-clone.txt
      - name: Narrate in the owner's voice
        env:
          STOP_AFTER_MIN: "200"
          PYTHONWARNINGS: ignore
          TRANSFORMERS_VERBOSITY: error
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: ~/clone-venv/bin/python -I clone.py
      - name: Report minutes used
        if: always()
        run: |
          secs=$(( $(date +%s) - ${EARMARK_T0:-$(date +%s)} + 15 ))
          tok=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=earmark-runner" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
          curl -s -o /dev/null -w "usage report: %{http_code}\n" -X POST -H "Authorization: Bearer $tok" -H "content-type: application/json" \
            --data "{\"seconds\":$secs}" https://listen.studiko.app/runner/usage || true
