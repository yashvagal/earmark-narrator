# Cloud narration for Earmark: claims chapters queued in the app and reads them aloud with Kokoro on this runner's
# CPU, then uploads the MP3. It proves who it is to the Worker with GitHub's OIDC token, so no secrets live here.
# This repo is public on purpose (public repos get GitHub-hosted runner minutes free); books, text and audio never
# touch it and logs print no titles or text. The app starts it the moment a book is queued (Worker secret
# GITHUB_DISPATCH_TOKEN); the schedule every 6 hours is only a backup. Each run starts up to 8 runners with
# 3 narrators each; the Worker hands every chapter to exactly one of them.
name: narrate
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
jobs:
  # Sizes the run: one runner per 3 queued chapters, up to 8 (public repos get these minutes free, 20 jobs at once).
  plan:
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.count.outputs.runners }}
    steps:
      - id: count
        run: |
          h=$(curl -s -o /dev/null -D - https://listen.studiko.app/runner/queued | tr -d '\r')
          n=$(printf '%s\n' "$h" | sed -n 's/^x-queued: *//Ip' | head -1)
          # An older Worker answers 200 without the count: still start one runner.
          if [ -z "$n" ]; then printf '%s\n' "$h" | head -1 | grep -q ' 200' && n=1 || n=0; fi
          r=$(( (n + 2) / 3 )); [ "$r" -gt 8 ] && r=8
          echo "queued $n, runners $r"
          echo "runners=$(seq -s, 1 $r | sed 's/^/[/;s/$/]/;s/^\[\]$/[]/')" >> "$GITHUB_OUTPUT"
  narrate:
    needs: plan
    if: needs.plan.outputs.runners != '[]' && needs.plan.outputs.runners != ''
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    steps:
      - name: Start the clock
        run: echo "EARMARK_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installed packages cache
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ hashFiles('package-lock.json') }}
      - name: Voice model cache
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: kokoro-82m-v1-fp32
      - name: Install
        if: steps.deps.outputs.cache-hit != 'true'
        # The CPU build of onnxruntime ships inside the package; its install script only fetches GPU extras.
        run: npm install --no-audit --no-fund --ignore-scripts
      # Loads (and on a cold cache downloads) the voice once, so the three narrators below don't race to fetch it.
      - name: Warm the voice
        run: |
          node --input-type=module -e "const { KokoroTTS } = await import('kokoro-js'); await KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX', { dtype: 'fp32', device: 'cpu' }); console.log('voice ready')"
      - name: Narrate
        env:
          STOP_AFTER_MIN: "300"
        # Three narrators per runner: the voice engine barely uses a second core on its own, and the runner has four.
        run: |
          for i in 1 2 3; do npx tsx narrate.ts & sleep 2; done
          fail=0; for job in $(jobs -p); do wait "$job" || fail=1; done; exit $fail
      # Feeds the monthly tracker in Settings: GitHub bills each job rounded up to a whole minute, empty runs included.
      # Sends only a number of seconds; 15 s covers runner start-up before the first step.
      - name: Report minutes used
        if: always()
        run: |
          secs=$(( $(date +%s) - ${EARMARK_T0:-$(date +%s)} + 15 ))
          tok=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=earmark-runner" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
          curl -s -o /dev/null -w "usage report: %{http_code}\n" -X POST -H "Authorization: Bearer $tok" -H "content-type: application/json" \
            --data "{\"seconds\":$secs}" https://listen.studiko.app/runner/usage || true
